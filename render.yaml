services:
  - type: web
    name: techgenie-laptop-matchmaker
    env: python
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "cd laptop-matchmaker/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 20
